<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, user-scalable=no">
  <title>HandyMan Tilt 👷‍♂️</title>
  <style>
    body {
      margin: 0; padding: 0; width: 600px; height: 600px;
      background: rgba(0,0,0,0.92); color: #0ff; font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    canvas { display: block; margin: 0 auto; }
    .overlay { 
      position: absolute; top: 15px; left: 0; right: 0; text-align: center;
      pointer-events: none; font-size: 22px; text-shadow: 0 0 10px #0ff; 
    }
    .debug {
      position: absolute; bottom: 120px; left: 10px; font-size: 13px;
      background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; line-height: 1.4;
      max-width: 340px;
    }
    button, .focusable {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 14px 32px; font-size: 18px; background: #0ff; color: #000;
      border: none; border-radius: 10px; font-weight: bold;
    }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="600"></canvas>
  
  <div class="overlay" id="score">Score: 0</div>
  <div class="overlay" id="status" style="top: 55px; font-size:18px;">Press Enable Sensors</div>
  
  <div class="debug" id="debug">
    Beta: 0° | Gamma: 0°<br>
    Offset β: 0 | γ: 0<br>
    Calibrated: No
  </div>

  <button onclick="enableSensors()" class="focusable" id="mainBtn">Enable Sensors</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let player = { x: 300, y: 150, vx: 0, vy: 0, size: 22 };
    let score = 0, gameOver = false;
    let targets = [];
    let tiltX = 0, tiltY = 0;

    // Calibration
    let offsetBeta = 0, offsetGamma = 0;
    let isCalibrating = false, calibrationSamples = [], isCalibrated = false;

    function generateTargets() {
      targets = [];
      const tools = ['🔧','🔨','🪛','💡','📏','🛠️'];
      for (let i = 0; i < 9; i++) {
        targets.push({ 
          x: 80 + Math.random() * 440, 
          y: 80 + Math.random() * 440, 
          r: 14,
          type: tools[i % tools.length]
        });
      }
    }

    function drawHandyman(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Shadow
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#0f0';

      // Body (overalls)
      ctx.fillStyle = '#2244ff';
      ctx.fillRect(-12, 8, 24, 28);

      // Head
      ctx.fillStyle = '#ffddaa';
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();

      // Hard hat
      ctx.fillStyle = '#ff8800';
      ctx.beginPath();
      ctx.ellipse(0, -8, 15, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-5, -2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -2, 3, 0, Math.PI * 2); ctx.fill();

      // Smile
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 4, 6, 0.2, Math.PI - 0.2);
      ctx.stroke();

      // Arms + Tool (Hammer)
      ctx.strokeStyle = '#ffddaa';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-12, 12); ctx.lineTo(-22, 22); // left arm
      ctx.moveTo(12, 12); ctx.lineTo(25, 8);    // right arm
      ctx.stroke();

      // Hammer head
      ctx.fillStyle = '#888';
      ctx.fillRect(25, 4, 10, 8);
      ctx.fillStyle = '#555';
      ctx.fillRect(28, -6, 4, 22);

      ctx.restore();
    }

    function drawToolTarget(t) {
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.font = '28px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff0';
      ctx.fillText(t.type, 0, 0);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, 600, 600);

      // Workshop background walls
      ctx.fillStyle = '#0ff';
      ctx.fillRect(0, 0, 600, 40);
      ctx.fillRect(0, 560, 600, 40);
      ctx.fillRect(0, 0, 40, 600);
      ctx.fillRect(560, 0, 40, 600);

      // Inner workshop shelves / obstacles
      ctx.fillRect(150, 150, 300, 20);
      ctx.fillRect(150, 300, 20, 200);
      ctx.fillRect(430, 250, 20, 200);

      // Draw targets (tools)
      targets.forEach(t => drawToolTarget(t));

      // Draw HandyMan
      drawHandyman(player.x, player.y);
    }

    function update() {
      if (gameOver || !isCalibrated) return;

      player.vx += tiltX * 0.5;
      player.vy += tiltY * 0.75;

      player.vx *= 0.88;
      player.vy *= 0.88;

      player.x += player.vx;
      player.y += player.vy;

      // Boundaries
      if (player.x < 55) { player.x = 55; player.vx *= -0.6; }
      if (player.x > 545) { player.x = 545; player.vx *= -0.6; }
      if (player.y < 55) { player.y = 55; player.vy *= -0.6; }
      if (player.y > 545) { player.y = 545; player.vy *= -0.6; }

      // Collect tools
      for (let i = targets.length-1; i >= 0; i--) {
        const t = targets[i];
        const d = Math.hypot(player.x - t.x, player.y - t.y);
        if (d < player.size + t.r) {
          targets.splice(i, 1);
          score += 100;
          document.getElementById('score').textContent = `Score: ${score}`;
        }
      }

      if (targets.length === 0) {
        gameOver = true;
        document.getElementById('status').textContent = "🎉 Workshop Complete! Great job HandyMan!";
      }
      draw();
    }

    function handleOrientation(e) {
      const rawBeta = e.beta || 0;
      const rawGamma = e.gamma || 0;

      tiltX = (rawGamma - offsetGamma) / 60;
      tiltY = (rawBeta - offsetBeta) / 55;

      document.getElementById('debug').innerHTML = 
        `Beta: ${rawBeta.toFixed(1)}° | Gamma: ${rawGamma.toFixed(1)}°<br>` +
        `Offset β: ${offsetBeta.toFixed(1)} | γ: ${offsetGamma.toFixed(1)}<br>` +
        `Calibrated: ${isCalibrated ? 'Yes ✓' : 'No'}`;
    }

    function handleMotion(e) {
      if (e.rotationRate && isCalibrated) {
        const pitchRate = e.rotationRate.beta || 0;
        if (Math.abs(pitchRate) > 1.5) tiltY += pitchRate * 0.01;
      }
    }

    function startCalibration() {
      isCalibrating = true;
      calibrationSamples = [];
      document.getElementById('status').textContent = "Hold head straight & still... (3 sec)";
      document.getElementById('mainBtn').textContent = "Calibrating...";

      setTimeout(() => {
        isCalibrating = false;
        if (calibrationSamples.length > 5) {
          let sumBeta = 0, sumGamma = 0;
          calibrationSamples.forEach(s => { sumBeta += s.beta; sumGamma += s.gamma; });
          offsetBeta = sumBeta / calibrationSamples.length;
          offsetGamma = sumGamma / calibrationSamples.length;
          isCalibrated = true;
        }
        document.getElementById('status').textContent = "✅ Ready to fix the workshop!";
        document.getElementById('mainBtn').textContent = "Restart Job";
        document.getElementById('mainBtn').onclick = resetGame;
      }, 3200);
    }

    function collectCalibrationSample(e) {
      if (isCalibrating) calibrationSamples.push({ beta: e.beta || 0, gamma: e.gamma || 0 });
    }

    async function enableSensors() {
      document.getElementById('status').textContent = "Requesting permissions...";
      if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
      }
      if (typeof DeviceMotionEvent?.requestPermission === 'function') {
        try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
      }

      window.addEventListener('deviceorientation', handleOrientation);
      window.addEventListener('deviceorientation', collectCalibrationSample);
      window.addEventListener('devicemotion', handleMotion);

      setTimeout(startCalibration, 800);
    }

    function resetGame() {
      player.x = 300; player.y = 150; player.vx = player.vy = 0;
      score = 0; gameOver = false;
      document.getElementById('score').textContent = 'Score: 0';
      generateTargets();
      document.getElementById('status').textContent = "Collect all the tools!";
    }

    window.onload = () => {
      resetGame();
      setInterval(update, 16);

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') tiltY = -1.2;
        if (e.key === 'ArrowDown') tiltY = 1.2;
        if (e.key === 'ArrowLeft') tiltX = -1.2;
        if (e.key === 'ArrowRight') tiltX = 1.2;
        if (e.key === 'c' || e.key === 'C') startCalibration();
      });
    };
  </script>
</body>
</html>
