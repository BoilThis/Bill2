<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, user-scalable=no">
  <title>HeadTilt Balance 👓</title>
  <style>
    body {
      margin: 0; padding: 0; width: 600px; height: 600px;
      background: rgba(0,0,0,0.92); color: #0ff; font-family: system-ui, sans-serif;
      overflow: hidden; touch-action: none;
    }
    canvas { display: block; margin: 0 auto; }
    .overlay {
      position: absolute; top: 20px; left: 0; right: 0; text-align: center;
      pointer-events: none; font-size: 22px; text-shadow: 0 0 10px #0ff;
    }
    button, .focusable {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 30px; font-size: 18px; background: #0ff; color: #000;
      border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
    }
    button:active, .focusable:focus { background: #0cc; }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="600"></canvas>
  
  <div class="overlay" id="score">Score: 0</div>
  <div class="overlay" id="status" style="top: 60px; font-size:18px;"></div>
  
  <button onclick="resetGame()" class="focusable">Restart Game</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let ball = { x: 300, y: 150, radius: 18, vx: 0, vy: 0 };
    let score = 0;
    let gameOver = false;
    let targets = [];
    let tiltX = 0, tiltY = 0;

    // Generate random targets
    function generateTargets() {
      targets = [];
      for (let i = 0; i < 8; i++) {
        targets.push({
          x: 80 + Math.random() * 440,
          y: 80 + Math.random() * 440,
          r: 12
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, 600, 600);

      // Simple maze walls (rectangles)
      ctx.fillStyle = '#0ff';
      ctx.fillRect(0, 0, 600, 40);           // top
      ctx.fillRect(0, 560, 600, 40);         // bottom
      ctx.fillRect(0, 0, 40, 600);           // left
      ctx.fillRect(560, 0, 40, 600);         // right
      ctx.fillRect(150, 150, 300, 20);       // horizontal walls
      ctx.fillRect(150, 300, 20, 200);
      ctx.fillRect(430, 250, 20, 200);

      // Draw targets
      ctx.fillStyle = '#f0f';
      targets.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw ball
      ctx.fillStyle = '#0f0';
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#0f0';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function update() {
      if (gameOver) return;

      // Apply tilt (sensitivity adjustable)
      ball.vx += tiltX * 0.35;
      ball.vy += tiltY * 0.35;

      // Friction
      ball.vx *= 0.92;
      ball.vy *= 0.92;

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall collisions
      if (ball.x - ball.radius < 50) { ball.x = 50 + ball.radius; ball.vx = -ball.vx * 0.6; }
      if (ball.x + ball.radius > 550) { ball.x = 550 - ball.radius; ball.vx = -ball.vx * 0.6; }
      if (ball.y - ball.radius < 50) { ball.y = 50 + ball.radius; ball.vy = -ball.vy * 0.6; }
      if (ball.y + ball.radius > 550) { ball.y = 550 - ball.radius; ball.vy = -ball.vy * 0.6; }

      // Inner walls (simple checks)
      if (ball.y > 140 && ball.y < 180 && ball.x > 130 && ball.x < 470) {
        ball.y = 140 - ball.radius; ball.vy = -ball.vy * 0.7;
      }
      // ... (add more if needed)

      // Collect targets
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        const dx = ball.x - t.x;
        const dy = ball.y - t.y;
        if (dx * dx + dy * dy < (ball.radius + t.r) ** 2) {
          targets.splice(i, 1);
          score += 100;
          document.getElementById('score').textContent = `Score: ${score}`;
        }
      }

      if (targets.length === 0) {
        gameOver = true;
        document.getElementById('status').textContent = "🎉 YOU WIN! All targets collected!";
      }

      draw();
    }

    // Sensor input
    function handleOrientation(e) {
      tiltX = (e.gamma || 0) / 90;   // left-right
      tiltY = (e.beta || 0) / 90;    // forward-back
    }

    // Keyboard fallback (D-pad / Neural Band)
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') tiltX = -0.8;
      if (e.key === 'ArrowRight') tiltX = 0.8;
      if (e.key === 'ArrowUp') tiltY = -0.8;
      if (e.key === 'ArrowDown') tiltY = 0.8;
      if (e.key === 'r' || e.key === 'R') resetGame();
    });

    function resetGame() {
      ball.x = 300; ball.y = 150;
      ball.vx = 0; ball.vy = 0;
      score = 0;
      gameOver = false;
      document.getElementById('score').textContent = 'Score: 0';
      document.getElementById('status').textContent = 'Tilt your head!';
      generateTargets();
    }

    // Auto start
    window.onload = () => {
      resetGame();
      // Enable sensors
      if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(() => {});
      }
      window.addEventListener('deviceorientation', handleOrientation);

      setInterval(update, 16); // ~60fps
      document.getElementById('status').textContent = 'Tilt your head to move!';
    };
  </script>
</body>
</html>
