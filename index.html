<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0">
  <title>Grok Vision Assistant</title>
  <style>
    body {
      margin: 0; padding: 20px; width: 600px; height: 600px;
      background: rgba(0,0,0,0.8); color: #0ff; font-family: system-ui;
      overflow: hidden; text-align: center; /* Dark for transparent display */
    }
    h1 { font-size: 28px; margin: 10px 0; }
    .content { margin: 20px; padding: 15px; background: rgba(0,255,255,0.1); border-radius: 12px; }
    button, .focusable {
      padding: 12px 24px; margin: 8px; font-size: 18px;
      background: #0ff; color: #000; border: none; border-radius: 8px;
      cursor: pointer; width: 80%;
    }
    button:hover, .focusable:focus { background: #0cc; }
    #status { font-size: 16px; min-height: 60px; }
    /* High contrast + simple for glasses */
  </style>
</head>
<body>
  <h1>👓 Grok on Ray-Ban</h1>
  <div class="content">
    <p>Say "Hey Meta" for voice/camera or use buttons below.</p>
    <button onclick="startVoice()" class="focusable">🎤 Start Voice Mode</button>
    <button onclick="simulateCamera()" class="focusable">📹 Simulate POV Camera</button>
  </div>
  <div id="status">Ready — Use D-pad / Neural Band to navigate</div>

  <script>
    function updateStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function startVoice() {
      updateStatus('Voice activated — Speak now (uses Meta AI integration)');
      // In real glasses: Trigger Meta voice or Web Speech if available
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance("Hello! How can I assist with your view today?");
        speechSynthesis.speak(utterance);
      }
    }

    function simulateCamera() {
      updateStatus('POV Camera active (in full version: streams via Meta SDK companion)');
      // Placeholder — real camera access often needs phone-side SDK + display overlay
      setTimeout(() => updateStatus('📸 Captured view! Describe what you see?'), 1500);
    }

    // D-pad / focus simulation (Meta handles input)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') updateStatus('Navigated down');
    });

    updateStatus('Web App loaded on Ray-Ban Display');
  </script>
</body>
</html>
