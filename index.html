<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILLY'S DELIVERY</title>
    <style>
        :root { font-size: 21px; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #0ff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            text-align: center;
            padding: 16px;
            background: linear-gradient(90deg, #0ff, #ff0, #0ff);
            color: #000;
            font-size: 1.85rem;
            font-weight: 700;
        }
        #game-container {
            position: relative;
            margin: 12px;
            border: 6px solid #0ff;
            border-radius: 22px;
            box-shadow: 0 0 60px #0ff;
            overflow: hidden;
        }
        canvas { display: block; background: #112; }
        .overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,20,0.97);
            padding: 40px 50px;
            border-radius: 20px;
            border: 5px solid #0ff;
            text-align: center;
            display: none;
            flex-direction: column;
            gap: 22px;
            min-width: 320px;
        }
        button {
            background: linear-gradient(135deg, #0ff, #ff0);
            color: #000;
            border: none;
            padding: 20px 44px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            min-height: 72px;
        }
        .score, .highscore {
            position: absolute; background: rgba(0,0,0,0.8);
            padding: 10px 24px; border-radius: 999px;
            font-weight: 700; border: 3px solid #0ff;
        }
        .score { top: 22px; left: 22px; font-size: 1.45rem; color: #0ff; }
        .highscore { top: 22px; right: 22px; font-size: 1.1rem; color: #ff0; }
        .instructions { position: absolute; bottom: 22px; text-align: center; font-size: 1rem; color: #0aa; width: 100%; }
    </style>
</head>
<body>
    <header>BILLY'S DELIVERY 🛵</header>
    
    <div id="game-container">
        <div class="score" id="score">0m</div>
        <div class="highscore" id="highscore">HI 0m</div>
        <canvas id="canvas" width="520" height="520"></canvas>
        
        <div id="overlay" class="overlay">
            <h2 id="title">BILLY'S DELIVERY</h2>
            <div id="subtitle" style="color:#0ff; font-size:1.55rem;">Deliver the shirts!</div>
            <button onclick="startGame()">START DELIVERING!</button>
        </div>
    </div>

    <div class="instructions">
        ↑ THROW SHIRT &nbsp;&nbsp;&nbsp; ← → MOVE &nbsp;&nbsp;&nbsp; SPACE = PAUSE
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highEl = document.getElementById('highscore');
        const overlay = document.getElementById('overlay');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');

        let player = { x: 260, lane: 1, y: 0, throwing: false };
        let obstacles = [], shirts = [], particles = [];
        let distance = 0, speed = 6.8;
        let gameRunning = false, paused = false;
        let gameInterval;
        let highScore = localStorage.getItem('billyDeliveryHigh') || 0;
        let delivered = 0;

        const LANES = [160, 260, 360];

        function createParticles(x, y, color) {
            for (let i = 0; i < 18; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*10,
                    vy: (Math.random()-0.5)*10 - 4,
                    life: 28,
                    color
                });
            }
        }

        function spawnObstacle() {
            if (Math.random() < 0.09) {
                obstacles.push({ lane: Math.floor(Math.random()*3), x: 520 });
            }
        }

        function spawnShirtTarget() {
            if (Math.random() < 0.45) {
                shirts.push({ lane: Math.floor(Math.random()*3), x: 520, hit: false });
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#0a0a1f'; ctx.fillRect(0,0,520,520);
            ctx.fillStyle = '#1a2a1a'; ctx.fillRect(0,320,520,200); // grass/road
            
            const scroll = (Date.now() / 5) % 100;
            ctx.strokeStyle = '#0a0'; ctx.lineWidth = 6;
            for (let i = -100; i < 700; i += 70) {
                ctx.beginPath();
                ctx.moveTo(i + scroll, 380);
                ctx.lineTo(i + scroll + 80, 380);
                ctx.stroke();
            }
        }

        function drawPlayer() {
            const x = LANES[player.lane];
            const y = 360 + player.y;
            ctx.shadowBlur = 20; ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#28a'; ctx.fillRect(x-22, y-45, 44, 50); // body
            ctx.fillStyle = '#fdb'; ctx.beginPath(); ctx.arc(x, y-55, 16, 0, Math.PI*2); ctx.fill(); // head
            ctx.fillStyle = '#f00'; ctx.fillRect(x-18, y-68, 36, 12); // cap
        }

        function drawObstacles() {
            ctx.shadowBlur = 15; ctx.shadowColor = '#f44';
            obstacles.forEach(o => {
                ctx.fillStyle = '#842';
                ctx.fillRect(o.x-25, 355, 50, 55);
            });
        }

        function drawShirtTargets() {
            shirts.forEach(s => {
                if (s.hit) return;
                const x = s.x;
                ctx.fillStyle = '#ff0';
                ctx.fillRect(x-18, 260, 36, 32);
                ctx.fillStyle = '#fff';
                ctx.fillRect(x-18, 260, 36, 9);
            });
        }

        function update() {
            if (!gameRunning || paused) return;

            distance += speed / 4;
            scoreEl.textContent = Math.floor(distance) + 'm';

            if (distance > 800) speed = 8.5;
            if (distance > 2000) speed = 10.5;

            obstacles.forEach(o => o.x -= speed);
            shirts.forEach(s => s.x -= speed);

            obstacles = obstacles.filter(o => o.x > -60);
            shirts = shirts.filter(s => s.x > -60);

            if (player.y < 0) {
                player.y += 4;
                if (player.y > 0) player.y = 0;
            }

            if (Math.random() < 0.085) spawnObstacle();
            if (Math.random() < 0.5) spawnShirtTarget();

            const px = LANES[player.lane];
            obstacles.forEach(o => {
                if (o.x < px + 30 && o.x + 40 > px - 30) gameOver();
            });

            shirts.forEach((s, i) => {
                if (!s.hit && s.x < px + 35 && s.x + 30 > px - 35) {
                    s.hit = true;
                    delivered++;
                    createParticles(s.x, 270, '#ff0');
                }
            });

            for (let i = particles.length-1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life--;
                if (p.life <= 0) particles.splice(i,1);
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, 520, 520);
            drawBackground();
            drawObstacles();
            drawShirtTargets();
            drawPlayer();
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 28;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 6, 6);
            });
            ctx.globalAlpha = 1;
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            if (distance > highScore) {
                highScore = Math.floor(distance);
                localStorage.setItem('billyDeliveryHigh', highScore);
                highEl.textContent = `HI ${highScore}m`;
            }
            title.textContent = "DELIVERY FAILED";
            subtitle.innerHTML = `Delivered <b>${delivered}</b> shirts • ${Math.floor(distance)}m`;
            overlay.style.display = 'flex';
        }

        function startGame() {
            overlay.style.display = 'none';
            distance = 0; speed = 6.8; delivered = 0;
            obstacles = []; shirts = []; particles = [];
            player = { lane: 1, y: 0, vy: 0, jumping: false };
            scoreEl.textContent = '0m';
            gameRunning = true; paused = false;
            draw();
            gameInterval = setInterval(update, 1000/65);
        }

        function togglePause() {
            if (!gameRunning) return;
            paused = !paused;
            if (paused) {
                clearInterval(gameInterval);
                title.textContent = "PAUSED";
                subtitle.innerHTML = `Distance: <b>${Math.floor(distance)}m</b>`;
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                gameInterval = setInterval(update, 1000/65);
            }
        }

        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowLeft': if (player.lane > 0) player.lane--; break;
                case 'ArrowRight': if (player.lane < 2) player.lane++; break;
                case 'ArrowUp':
                    if (!player.jumping) {
                        player.jumping = true;
                        player.y = -65;
                    }
                    break;
                case ' ': togglePause(); break;
            }
        });

        window.onload = () => {
            draw();
            overlay.style.display = 'flex';
            highEl.textContent = `HI ${highScore}m`;
        };
    </script>
</body>
</html>
