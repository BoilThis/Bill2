<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tilt Maze - Ray-Ban Glasses</title>
<style>
  body { margin:0; background:#000; overflow:hidden; font-family:Arial; }
  canvas { display:block; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #0f0; font-size: 18px;
    text-shadow: 0 0 5px #0f0; pointer-events: none;
  }
</style>
</head>
<body>

<div id="info">Tilt your head to move the ball • Reach the green goal</div>
<canvas id="canvas"></canvas>

<script>
// ============== CONFIG ==============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let WIDTH = 600;
let HEIGHT = 600;
canvas.width = WIDTH;
canvas.height = HEIGHT;

// Ball
let ball = { x: 80, y: 80, radius: 12, vx: 0, vy: 0 };

// Goal
const goal = { x: 480, y: 480, size: 30 };

// Simple maze walls (x, y, width, height)
const walls = [
  // Border
  {x:0, y:0, w:WIDTH, h:20},
  {x:0, y:HEIGHT-20, w:WIDTH, h:20},
  {x:0, y:0, w:20, h:HEIGHT},
  {x:WIDTH-20, y:0, w:20, h:HEIGHT},
  
  // Inner walls
  {x:150, y:100, w:20, h:250},
  {x:300, y:50,  w:20, h:200},
  {x:450, y:200, w:20, h:250},
  {x:80,  y:350, w:250, h:20},
  {x:380, y:380, w:180, h:20},
  {x:200, y:480, w:20, h:100},
];

// Game state
let gameOver = false;
let won = false;

// ============== SENSOR SETUP ==============
let tiltX = 0; // gamma (left/right)
let tiltY = 0; // beta  (forward/back)

function handleOrientation(event) {
  tiltX = event.gamma || 0;   // -90 to 90 (left/right)
  tiltY = event.beta || 0;    // -90 to 90 (forward/back)
}

// Request permission & start listening
function startSensors() {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(permission => {
        if (permission === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      });
  } else {
    // Most glasses/web environments don't need explicit permission
    window.addEventListener('deviceorientation', handleOrientation);
  }
}

// ============== GAME LOOP ==============
function update() {
  if (gameOver || won) return;

  // Apply tilt to velocity (sensitivity tweakable)
  const sensitivity = 0.12;
  ball.vx += tiltX * sensitivity;
  ball.vy += tiltY * sensitivity;

  // Friction
  ball.vx *= 0.92;
  ball.vy *= 0.92;

  // Move ball
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Wall collisions
  for (let wall of walls) {
    if (checkCollision(ball, wall)) {
      // Simple bounce
      if (Math.abs(ball.vx) > Math.abs(ball.vy)) ball.vx = -ball.vx * 0.6;
      else ball.vy = -ball.vy * 0.6;
      
      // Push out of wall
      if (ball.x < wall.x) ball.x = wall.x - ball.radius;
      if (ball.x > wall.x + wall.w) ball.x = wall.x + wall.w + ball.radius;
      if (ball.y < wall.y) ball.y = wall.y - ball.radius;
      if (ball.y > wall.y + wall.h) ball.y = wall.y + wall.h + ball.radius;
    }
  }

  // Boundary check
  if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx = -ball.vx * 0.6; }
  if (ball.x + ball.radius > WIDTH) { ball.x = WIDTH - ball.radius; ball.vx = -ball.vx * 0.6; }
  if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy = -ball.vy * 0.6; }
  if (ball.y + ball.radius > HEIGHT) { ball.y = HEIGHT - ball.radius; ball.vy = -ball.vy * 0.6; }

  // Win condition
  if (Math.hypot(ball.x - goal.x - goal.size/2, ball.y - goal.y - goal.size/2) < 30) {
    won = true;
    gameOver = true;
  }
}

function checkCollision(ball, wall) {
  return !(
    ball.x + ball.radius < wall.x ||
    ball.x - ball.radius > wall.x + wall.w ||
    ball.y + ball.radius < wall.y ||
    ball.y - ball.radius > wall.y + wall.h
  );
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Draw walls
  ctx.fillStyle = '#0ff';
  for (let wall of walls) {
    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
  }

  // Draw goal
  ctx.fillStyle = '#0f0';
  ctx.fillRect(goal.x, goal.y, goal.size, goal.size);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('GOAL', goal.x + goal.size/2, goal.y + goal.size/2 + 7);

  // Draw ball
  ctx.fillStyle = '#ff0';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fill();

  // Win message
  if (won) {
    ctx.fillStyle = 'rgba(0,255,0,0.9)';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('YOU WIN!', WIDTH/2, HEIGHT/2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ============== START ==============
startSensors();
loop();

// Optional: Reset with double-tap or gesture (you can expand this)
document.addEventListener('dblclick', () => {
  ball.x = 80; ball.y = 80;
  ball.vx = 0; ball.vy = 0;
  won = false; gameOver = false;
});
</script>

</body>
</html>
